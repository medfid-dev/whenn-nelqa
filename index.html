<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>وين لقيتها؟</title>
<meta name="description" content="رادار الندرة اللحظي: اعرف وين الحليب والزيت والسميد متوفرة الآن، من بلاغات الناس.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#edf3f1; --surface:#fff; --ink:#0e1f1d; --mute:#5f716d; --line:#e1eae7;
  --brand:#0f766e; --brand-ink:#063f3a; --brand-soft:#d6eee9;
  --ok:#12803f; --ok-soft:#dcf5e4; --no:#c02a2a; --no-soft:#fde3e0; --warn:#9a5a06; --warn-soft:#fdefc9;
  --shadow:0 1px 2px rgba(6,63,58,.06),0 8px 24px -8px rgba(6,63,58,.16);
  --font:'Readex Pro',system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1312; --surface:#14201e; --ink:#e7f1ef; --mute:#92a7a3; --line:#23352f;
    --brand:#2dd4bf; --brand-ink:#04211e; --brand-soft:#133a35;
    --ok:#4ade80; --ok-soft:#14361f; --no:#f87171; --no-soft:#3a1818; --warn:#fbbf24; --warn-soft:#3a2a0e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* الشريط العلوي */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:40px;height:40px;border-radius:13px;background:var(--brand);display:grid;place-items:center;font-size:1.25rem;
  box-shadow:0 6px 14px -4px color-mix(in srgb,var(--brand) 60%,transparent)}
.logo b{display:block;font-size:1.12rem;font-weight:700;line-height:1.2}
.logo small{display:block;color:var(--mute);font-size:.74rem;font-weight:400}
.loc{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:99px;font-size:.8rem;font-weight:500;box-shadow:var(--shadow)}

main{max-width:720px;margin:0 auto;padding:6px 16px 150px}

/* بطاقة الملخص */
.pulse{background:var(--brand);color:#fff;border-radius:26px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 14px 30px -12px color-mix(in srgb,var(--brand) 70%,#000)}
.pulse::after{content:"";position:absolute;inset-inline-start:-60px;top:-70px;width:200px;height:200px;border-radius:50%;
  border:28px solid rgba(255,255,255,.07);pointer-events:none}
.pulse-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.pulse h1{margin:0;font-size:1.05rem;font-weight:600}
#radius{appearance:none;-webkit-appearance:none;border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 14px;border-radius:99px;font-size:.82rem;font-weight:500}
#radius option{color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;margin-top:14px;position:relative}
.stat{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px}
.stat strong{display:block;font-size:1.7rem;font-weight:700;line-height:1.1}
.stat span{font-size:.74rem;opacity:.92;white-space:nowrap}
.stat.ok strong::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#7ef0a4;margin-inline-end:7px;vertical-align:middle}
.stat.no strong::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff9a94;margin-inline-end:7px;vertical-align:middle}

/* بلاطات السلع */
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-width:68px;white-space:nowrap;padding-inline:12px !important;border:1px solid var(--line);background:var(--surface);border-radius:20px;
  padding:9px 4px 8px;font-size:.76rem;font-weight:500;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:var(--shadow);transition:background .15s,color .15s,transform .15s}
.chip span{font-size:1.55rem;line-height:1}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip:active{transform:scale(.96)}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:9px 13px;font-size:.78rem;margin-bottom:10px;line-height:1.6}
.banner b{font-weight:700}

/* بطاقات البلاغات */
.card{background:var(--surface);border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
  display:flex;gap:13px;align-items:flex-start}
.tile{flex:none;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-size:1.85rem;background:var(--bg)}
.card.ok .tile{background:var(--ok-soft)} .card.no .tile{background:var(--no-soft)}
.bd{flex:1;min-width:0}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row1 b{font-size:1.08rem;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--no-soft);color:var(--no)}
.badge.mix{background:var(--warn-soft);color:var(--warn)}
.badge.old{background:var(--bg);color:var(--mute);font-weight:500}
.badge.src{background:var(--bg);color:var(--mute);font-weight:500}
.live{width:8px;height:8px;border-radius:50%;background:currentColor;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fact{background:var(--bg);color:var(--mute);border-radius:10px;padding:3px 9px;font-size:.78rem;max-width:100%;overflow-wrap:anywhere}
.fact.hl{background:var(--brand-soft);color:var(--brand);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.acts button,.acts a{border:0;background:var(--bg);border-radius:13px;padding:8px 12px;font-size:.8rem;font-weight:500;text-decoration:none;color:var(--ink);
  display:inline-flex;align-items:center;gap:4px}
.acts .y{background:var(--ok-soft);color:var(--ok);font-weight:600}
.acts .n{background:var(--no-soft);color:var(--no);font-weight:600}
.acts .sp{margin-inline-start:auto}

/* بطاقة الأخبار */
.news{background:var(--surface);border-radius:24px;padding:16px 14px 6px;margin-bottom:14px;box-shadow:var(--shadow)}
.news h2{margin:0 0 2px;font-size:1.02rem;font-weight:600}
.news .sub{color:var(--mute);font-size:.78rem;margin-bottom:6px;line-height:1.7}
.nrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.nrow .tile{width:46px;height:46px;border-radius:15px;font-size:1.4rem}
.nrow .src{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.nrow .src a{color:var(--brand);background:var(--brand-soft);text-decoration:none;font-size:.76rem;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}

.empty{text-align:center;color:var(--mute);padding:34px 20px 20px;line-height:1.9;background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.empty .big{font-size:2.6rem}
.empty b{color:var(--ink)}
#map{position:relative;isolation:isolate;z-index:0;height:calc(100vh - 330px);min-height:340px;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}

/* شريط التنقل السفلي */
.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(92vw,400px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;
  background:var(--surface);border-radius:28px;padding:8px 10px;box-shadow:0 14px 36px -10px rgba(6,63,58,.4),0 0 0 1px var(--line)}
.dock .nav{border:0;background:transparent;border-radius:18px;padding:7px 6px;color:var(--mute);font-size:.74rem;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.dock .nav i{font-style:normal;font-size:1.25rem;line-height:1.2}
.dock .nav.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
.fab{border:0;background:var(--brand);color:#fff;border-radius:22px;padding:12px 22px;font-size:.95rem;font-weight:700;
  display:flex;align-items:center;gap:8px;margin-top:-26px;box-shadow:0 10px 22px -6px color-mix(in srgb,var(--brand) 75%,#000),0 0 0 5px var(--surface)}
.fab:active{transform:scale(.97)}
.fab b{font-size:1.25rem;line-height:1;font-weight:500}
@media (prefers-color-scheme:dark){.fab{color:var(--brand-ink)}}

/* نافذة الإبلاغ */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,13,.55);z-index:40;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:30px 30px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.show{transform:none}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:1.25rem;font-weight:700}
.sheet p.sub{margin:0 0 14px;color:var(--mute);font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.pick{border:2px solid transparent;background:var(--bg);border-radius:18px;padding:8px 4px;text-align:center;font-size:.82rem;font-weight:500}
.pick span{display:block;font-size:1.45rem;line-height:1.3}
.pick.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{border:2px solid transparent;border-radius:18px;padding:15px 6px;font-weight:700;font-size:1rem;background:var(--bg)}
.st.ok.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.st.no.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
input[type=text]{width:100%;padding:14px;border-radius:16px;border:2px solid transparent;background:var(--bg);color:var(--ink);margin-bottom:14px}
input[type=text]:focus{border-color:var(--brand);outline:0}
.go{width:100%;border:0;background:var(--brand);color:#fff;border-radius:18px;padding:15px;font-weight:700;font-size:1.02rem}
@media (prefers-color-scheme:dark){.go{color:var(--brand-ink)}}
.go:disabled{opacity:.4}
.ghost{width:100%;margin-top:8px;border:0;background:transparent;color:var(--mute);border-radius:16px;padding:12px;font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;
  z-index:60;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
footer{max-width:720px;margin:0 auto;padding:0 20px 140px;color:var(--mute);font-size:.76rem;line-height:1.9;text-align:center}
.leaflet-popup-content{direction:rtl;font-family:inherit}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo"><span class="mark">📡</span><div><b>وين لقيتها؟</b><small>رادار الندرة في حيّك</small></div></div>
    <button class="loc" id="locBtn" type="button">📍 جارٍ تحديد موقعك…</button>
  </div>
</header>

<main>
  <div id="banners"></div>
  <section class="pulse" aria-label="ملخص">
    <div class="pulse-h">
      <h1>حولك الآن</h1>
      <select id="radius" aria-label="المسافة">
        <option value="2">ضمن 2 كم</option>
        <option value="5">ضمن 5 كم</option>
        <option value="10" selected>ضمن 10 كم</option>
        <option value="25">ضمن 25 كم</option>
        <option value="60">ضمن 60 كم</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
  </section>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div id="map" hidden></div>
</main>

<footer>
  البلاغات من المستخدمين ومن دون تحقق رسمي، فقد لا تكون دقيقة أو حديثة. وقسم «من الصحف» عناوين من مصادر عامة مع رابط كل خبر.<br>
  لا يعرض التطبيق أسعاراً ولا يجمع أسماء أو أرقاماً. البلاغات تختفي بعد ساعات قليلة.
</footer>

<nav class="dock" aria-label="التنقل">
  <button type="button" class="nav on" id="vList"><i>📋</i>القائمة</button>
  <button class="fab" id="fab" type="button"><b>+</b>أبلغ</button>
  <button type="button" class="nav" id="vMap"><i>🗺️</i>الخريطة</button>
</nav>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ الإعدادات ============ */
const CONFIG = {
  SUPABASE_URL: 'https://uhlktsguzjiebpqvvqal.supabase.co',        // مثال: https://xxxx.supabase.co   (اتركه فارغاً = وضع تجريبي محلي)
  SUPABASE_ANON_KEY: 'sb_publishable_rBAA93t-arOynsM4vP4XAw_W-5BjEjL',   // ضع هنا مفتاح publishable/anon الجديد (sb_publishable_...) — مفتاح anon/public فقط (وليس service_role أبداً)
  FRESH_HOURS: 6,          // عمر البلاغ الذي يظهر في التطبيق
  DEFAULT_POS: [36.7538, 3.0588], // الجزائر العاصمة، تُستخدم إن رفض المستخدم تحديد الموقع
};

const ITEMS = [
  {id:'milk',n:'حليب',e:'🥛'},{id:'baby_milk',n:'حليب الأطفال',e:'🍼'},{id:'oil',n:'زيت',e:'🫒'},
  {id:'semolina',n:'سميد',e:'🌾'},{id:'flour',n:'فرينة',e:'🌽'},{id:'bread',n:'خبز',e:'🥖'},
  {id:'sugar',n:'سكر',e:'🍬'},{id:'coffee',n:'قهوة',e:'☕'},{id:'eggs',n:'بيض',e:'🥚'},
  {id:'chicken',n:'دجاج',e:'🍗'},{id:'rice',n:'أرز',e:'🍚'},{id:'pasta',n:'معجنات',e:'🍝'},
  {id:'water',n:'ماء',e:'💧'},{id:'butane',n:'غاز البوتان',e:'🔥'},{id:'fuel',n:'وقود',e:'⛽'},
  {id:'medicine',n:'دواء',e:'💊'},{id:'diapers',n:'حفاظات',e:'👶'},{id:'cash',n:'سيولة نقدية',e:'💵'},
];
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
CONFIG.SUPABASE_URL = (CONFIG.SUPABASE_URL || '').trim().replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, ''); // يتسامح مع إضافة /rest/v1 بالخطأ
// المفاتيح الجديدة sb_publishable_ ليست JWT: ترسل في apikey فقط، أما المفاتيح القديمة eyJ فترسل في الحالتين
const hdr = (extra) => { const h = {apikey: CONFIG.SUPABASE_ANON_KEY}; if (/^eyJ/.test(CONFIG.SUPABASE_ANON_KEY)) h.Authorization = 'Bearer ' + CONFIG.SUPABASE_ANON_KEY; return Object.assign(h, extra || {}); };
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }
function deviceId(){
  let id = lsGet('wl_dev', '');
  if (!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)));
    lsSet('wl_dev', id);
  }
  return id;
}
function km(a, b, c, d){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (c - a) * rad, dLng = (d - b) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * rad) * Math.cos(c * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(d){ return d < 1 ? Math.max(50, Math.round(d * 10) * 100) + ' م' : d.toFixed(d < 10 ? 1 : 0) + ' كم'; }
function ago(ts){
  const m = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 60000));
  if (m < 2) return 'الآن';
  if (m < 60) return 'منذ ' + m + ' د';
  const h = Math.floor(m / 60);
  return 'منذ ' + h + ' سا' + (m % 60 >= 10 ? ' و' + (m % 60) + ' د' : '');
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ الحالة ============ */
let pos = CONFIG.DEFAULT_POS.slice(), posReal = false;
let radius = 10, filter = 'all', view = 'list';
let reports = [], groups = [];
let map = null, layer = null;

const qItem = new URLSearchParams(location.search).get('i');
if (qItem && BY_ID[qItem]) filter = qItem;

/* ============ الموقع ============ */
function locate(){
  const btn = $('#locBtn');
  if (!navigator.geolocation){ btn.textContent = '📍 الموقع غير مدعوم'; return Promise.resolve(); }
  btn.textContent = '📍 جارٍ تحديد موقعك…';
  return new Promise(res => {
    navigator.geolocation.getCurrentPosition(p => {
      pos = [p.coords.latitude, p.coords.longitude]; posReal = true;
      btn.textContent = '📍 موقعك مفعّل'; res();
    }, () => {
      posReal = false; btn.textContent = '📍 فعّل الموقع'; res();
    }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}

/* ============ البيانات ============ */
function seedDemo(){
  if (lsGet('wl_demo_seeded', '')) return;
  const out = [], now = Date.now();
  const names = ['سوق الحي','محل الزاوية','سوبيرات المدينة','مساحة تجارية','بريد الحي','محطة الخدمة'];
  const ids = ['milk','oil','semolina','milk','bread','butane','cash','fuel','sugar','coffee'];
  for (let i = 0; i < 10; i++){
    out.push({
      id:'d' + i, item:ids[i], status: i % 3 === 2 ? 'out' : 'available',
      lat: pos[0] + (Math.random() - .5) * .04, lng: pos[1] + (Math.random() - .5) * .05,
      place: names[i % names.length], created_at: new Date(now - Math.random() * 3 * 3600e3).toISOString(),
    });
  }
  lsSet('wl_demo', JSON.stringify(out)); lsSet('wl_demo_seeded', '1');
}

async function load(){
  const cutoff = new Date(Date.now() - CONFIG.FRESH_HOURS * 3600e3).toISOString();
  try {
    if (DEMO){
      seedDemo();
      reports = JSON.parse(lsGet('wl_demo', '[]')).filter(r => r.created_at > cutoff);
    } else {
      const dLat = radius / 111, dLng = radius / (111 * Math.max(.2, Math.cos(pos[0] * Math.PI / 180)));
      const p = new URLSearchParams();
      p.set('select', 'id,item,status,lat,lng,place,created_at');
      p.append('created_at', 'gte.' + cutoff);
      p.append('lat', 'gte.' + (pos[0] - dLat)); p.append('lat', 'lte.' + (pos[0] + dLat));
      p.append('lng', 'gte.' + (pos[1] - dLng)); p.append('lng', 'lte.' + (pos[1] + dLng));
      if (filter !== 'all') p.set('item', 'eq.' + filter);
      p.set('order', 'created_at.desc'); p.set('limit', '800');
      const r = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/wl_reports?' + p, {
        headers: hdr()
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      reports = await r.json();
    }
  } catch (e) {
    toast('تعذّر تحميل البلاغات، تحقق من الاتصال');
  }
  await loadNews();
  render();
}

/* ============ أخبار الندرة من مصادر عامة ============ */
const NEWS_EXTRA = {potato:{n:'بطاطس',e:'🥔'}};
let news = [], newsAt = 0;
async function loadNews(){
  if (DEMO || Date.now() - newsAt < 600e3) return;
  try {
    const p = new URLSearchParams();
    p.set('select', 'id,item,status,wilayas,title,source_name,source_url,published_at');
    p.append('published_at', 'gte.' + new Date(Date.now() - 48 * 3600e3).toISOString());
    p.set('order', 'published_at.desc'); p.set('limit', '120');
    const r = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/wl_news?' + p, {
      headers: hdr()
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    news = await r.json(); newsAt = Date.now();
  } catch (e) { console.warn('wl_news:', e); }
}
function newsHtml(){
  const rows = news.filter(n => filter === 'all' || n.item === filter);
  if (!rows.length) return '';
  const by = new Map();
  for (const n of rows){ if (!by.has(n.item)) by.set(n.item, []); by.get(n.item).push(n); }
  const cards = [...by.entries()].slice(0, 8).map(([item, list]) => {
    const it = BY_ID[item] || NEWS_EXTRA[item] || {n:item, e:'📰'};
    const sts = new Set(list.map(x => x.status));
    const st = (sts.has('mixed') || (sts.has('out') && sts.has('available'))) ? 'mixed' : (sts.has('out') ? 'out' : 'available');
    const label = st === 'out' ? 'نادر حسب الأخبار' : st === 'available' ? 'وفرة حسب الأخبار' : 'أخبار متضاربة';
    const cls = st === 'out' ? 'no' : st === 'available' ? 'ok' : 'mix';
    const w = [...new Set(list.flatMap(x => x.wilayas || []))].slice(0, 8);
    const links = list.slice(0, 3).filter(x => /^https?:\/\//.test(x.source_url)).map(x =>
      `<a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">${esc(x.source_name)}</a>`).join('');
    return `<div class="nrow"><div class="tile">${it.e}</div><div class="bd">
      <div class="row1"><b>${esc(it.n)}</b><span class="badge ${cls}">${label}</span><span class="badge src">مصدر عام</span></div>
      <div class="facts"><span class="fact">📍 ${w.length ? esc(w.join('، ')) : 'على المستوى الوطني'}</span><span class="fact">🕒 ${ago(list[0].published_at)}</span></div>
      <div class="src">${links}</div></div></div>`;
  }).join('');
  return `<div class="news"><h2>📰 من الصحف الجزائرية</h2>
    <div class="sub">أخبار عامة على مستوى الولاية أو الوطن، وليست بلاغات من محلات. قد تكون متأخرة أو متضاربة.</div>${cards}</div>`;
}

async function send(rep){
  const row = {
    item: rep.item, status: rep.status,
    lat: +rep.lat.toFixed(4), lng: +rep.lng.toFixed(4),
    place: rep.place ? rep.place.slice(0, 40) : null, device_id: deviceId(),
  };
  if (DEMO){
    const all = JSON.parse(lsGet('wl_demo', '[]'));
    all.push({...row, id:'u' + Date.now(), created_at:new Date().toISOString()});
    lsSet('wl_demo', JSON.stringify(all));
    return true;
  }
  const r = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/wl_reports', {
    method:'POST',
    headers: hdr({'Content-Type':'application/json', Prefer:'return=minimal'}),
    body: JSON.stringify(row),
  });
  if (!r.ok){
    const t = await r.text();
    if (/rate limit/i.test(t)) throw new Error('RATE');
    throw new Error('HTTP ' + r.status);
  }
  return true;
}

/* ============ التجميع والعرض ============ */
function buildGroups(){
  const map = new Map();
  for (const r of reports){
    if (filter !== 'all' && r.item !== filter) continue;
    const d = km(pos[0], pos[1], r.lat, r.lng);
    if (d > radius) continue;
    const key = r.item + '|' + r.lat.toFixed(3) + ',' + r.lng.toFixed(3);
    let g = map.get(key);
    if (!g){ g = {key, item:r.item, lat:r.lat, lng:r.lng, d, list:[]}; map.set(key, g); }
    g.list.push(r);
  }
  groups = [...map.values()].map(g => {
    g.list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    g.last = g.list[0];
    g.place = (g.list.find(x => x.place) || {}).place || '';
    const twoH = Date.now() - 2 * 3600e3;
    g.recent = g.list.filter(x => x.status === g.last.status && new Date(x.created_at).getTime() > twoH).length;
    return g;
  }).sort((a, b) => a.d - b.d);
}

function renderChips(){
  const all = [{id:'all', n:'الكل', e:'🔎'}, ...ITEMS];
  $('#chips').innerHTML = all.map(i =>
    `<button class="chip ${filter === i.id ? 'on' : ''}" data-f="${i.id}" type="button"><span>${i.e}</span>${i.n}</button>`).join('');
}

function renderBanners(){
  let h = '';
  if (DEMO) h += `<div class="banner"><b>وضع تجريبي:</b> هذه بيانات وهمية محفوظة في جهازك فقط. اربط Supabase (انظر README) لتصبح البلاغات مشتركة بين الناس.</div>`;
  if (!posReal) h += `<div class="banner"><b>الموقع غير مفعّل.</b> المسافات محسوبة من مركز الجزائر العاصمة. اضغط على «فعّل الموقع» أعلاه للحصول على نتائج قريبة منك.</div>`;
  $('#banners').innerHTML = h;
}

function renderStats(){
  const ok = groups.filter(g => g.last.status === 'available').length;
  const no = groups.length - ok;
  const nn = new Set(news.filter(n => filter === 'all' || n.item === filter).map(n => n.item)).size;
  $('#stats').innerHTML =
    `<div class="stat ok"><strong>${ok}</strong><span>أماكن متوفرة</span></div>` +
    `<div class="stat no"><strong>${no}</strong><span>أماكن نفدت</span></div>` +
    (nn ? `<div class="stat"><strong>${nn}</strong><span>في الأخبار</span></div>` : '');
}

function render(){
  buildGroups(); renderChips(); renderBanners(); renderStats();
  const list = $('#list');
  if (!groups.length){
    const name = filter === 'all' ? 'أي سلعة' : BY_ID[filter].n;
    list.innerHTML = newsHtml() + `<div class="empty"><div class="big">🛰️</div>
      لا توجد بلاغات حديثة عن <b>${esc(name)}</b> ضمن ${radius} كم.<br>
      اضغط «أبلغ» وكن أول من يخبر جيرانه.</div>`;
  } else {
    list.innerHTML = newsHtml() + groups.map((g, i) => {
      const it = BY_ID[g.item], ok = g.last.status === 'available';
      const old = Date.now() - new Date(g.last.created_at).getTime() > 3 * 3600e3;
      const fresh = Date.now() - new Date(g.last.created_at).getTime() < 30 * 60e3;
      return `<article class="card ${ok ? 'ok' : 'no'}">
        <div class="tile">${it.e}</div>
        <div class="bd">
          <div class="row1"><b>${it.n}</b>
            <span class="badge ${ok ? 'ok' : 'no'}">${fresh ? '<i class="live"></i>' : ''}${ok ? 'متوفر' : 'نفد'}</span>
            ${old ? '<span class="badge old">قديم نسبياً</span>' : ''}
          </div>
          <div class="facts">
            <span class="fact">📍 ${g.place ? esc(g.place) : 'موقع على الخريطة'}</span>
            <span class="fact">🧭 ${fmtDist(g.d)}</span>
            <span class="fact">🕒 ${ago(g.last.created_at)}</span>
            ${g.recent > 1 ? '<span class="fact hl">' + g.recent + ' بلاغات متطابقة</span>' : ''}
          </div>
          <div class="acts">
            <button class="y" data-a="yes" data-i="${i}" type="button">✓ ما زال متوفراً</button>
            <button class="n" data-a="no" data-i="${i}" type="button">✗ نفد الآن</button>
            <button class="sp" data-a="share" data-i="${i}" type="button">↗ مشاركة</button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}" target="_blank" rel="noopener">🧭 اتجاهات</a>
          </div>
        </div></article>`;
    }).join('');
  }
  if (view === 'map') renderMap();
}

function renderMap(){
  if (typeof L === 'undefined'){ toast('تعذّر تحميل الخريطة'); return; }
  if (!map){
    map = L.map('map').setView(pos, 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  L.circleMarker(pos, {radius:8, color:'#1d4ed8', fillColor:'#3b82f6', fillOpacity:1}).addTo(layer).bindPopup('أنت هنا');
  const pts = [pos];
  groups.forEach(g => {
    const ok = g.last.status === 'available', it = BY_ID[g.item];
    L.circleMarker([g.lat, g.lng], {radius:11, color: ok ? '#15803d' : '#b91c1c', fillColor: ok ? '#22c55e' : '#ef4444', fillOpacity:.85})
      .addTo(layer)
      .bindPopup(`<b>${it.e} ${it.n}</b> — ${ok ? 'متوفر' : 'نفد'}<br>${g.place ? esc(g.place) + '<br>' : ''}${ago(g.last.created_at)}`);
    pts.push([g.lat, g.lng]);
  });
  if (pts.length > 1) map.fitBounds(pts, {padding:[40, 40], maxZoom:15});
  else map.setView(pos, 14);
  setTimeout(() => map.invalidateSize(), 50);
}

/* ============ الإبلاغ ============ */
let sel = {item:null, status:null, lat:null, lng:null, place:'', fixedPlace:false};

function openSheet(pre){
  sel = {item:null, status:null, lat:pos[0], lng:pos[1], place:'', fixedPlace:false, ...(pre || {})};
  drawSheet();
  $('#bg').classList.add('show'); $('#sheet').classList.add('show');
}
function closeSheet(){ $('#bg').classList.remove('show'); $('#sheet').classList.remove('show'); }

function drawSheet(){
  const s = $('#sheet');
  s.innerHTML = `
    <h2>وش لقيت؟</h2>
    <p class="sub">بلاغك ينفع جيرانك ويوفّر عليهم التنقل. لا حاجة لتسجيل.</p>
    <div class="grid">${ITEMS.map(i => `<button class="pick ${sel.item === i.id ? 'on' : ''}" data-p="${i.id}" type="button"><span>${i.e}</span>${i.n}</button>`).join('')}</div>
    <div class="two">
      <button class="st ok ${sel.status === 'available' ? 'on' : ''}" data-s="available" type="button">✓ متوفر</button>
      <button class="st no ${sel.status === 'out' ? 'on' : ''}" data-s="out" type="button">✗ نفد</button>
    </div>
    <input type="text" id="place" maxlength="40" placeholder="اسم الحي أو المحل (اختياري)" value="${esc(sel.place)}">
    <button class="go" id="submit" type="button" ${sel.item && sel.status ? '' : 'disabled'}>إرسال البلاغ</button>
    <button class="ghost" id="cancel" type="button">إلغاء</button>`;
  $('#place').addEventListener('input', e => { sel.place = e.target.value; });
}

function doneSheet(rep){
  $('#sheet').innerHTML = `
    <h2>🙌 شكراً، بلاغك وصل</h2>
    <p class="sub">انشره في مجموعات الحي حتى يستفيد أكبر عدد من الناس.</p>
    <button class="go" id="shareNow" type="button">مشاركة على واتساب وغيره</button>
    <button class="ghost" id="cancel" type="button">إغلاق</button>`;
  $('#shareNow').onclick = () => shareReport(rep.item, rep.status, rep.place);
}

async function submit(){
  if (!sel.item || !sel.status) return;
  if (!posReal && !sel.fixedPlace){
    toast('فعّل الموقع أولاً حتى نحدد مكان البلاغ بدقة');
    await locate(); sel.lat = pos[0]; sel.lng = pos[1];
    if (!posReal) return;
  }
  const btn = $('#submit'); if (btn){ btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; }
  try {
    await send({item:sel.item, status:sel.status, lat:sel.lat, lng:sel.lng, place:sel.place.trim()});
    doneSheet({item:sel.item, status:sel.status, place:sel.place.trim()});
    load();
  } catch (e){
    toast(e.message === 'RATE' ? 'بلاغات كثيرة في وقت قصير، حاول لاحقاً' : 'تعذّر الإرسال، حاول مرة أخرى');
    if (btn){ btn.disabled = false; btn.textContent = 'إرسال البلاغ'; }
  }
}

/* ============ المشاركة ============ */
function shareReport(item, status, place){
  const it = BY_ID[item];
  const url = location.origin && location.origin !== 'null' ? location.origin + location.pathname + '?i=' + item : location.href;
  const msg = `${it.e} ${it.n} ${status === 'available' ? 'متوفر' : 'نفد'} الآن${place ? ' عند ' + place : ''}\nشوف الرادار قبل ما تتنقل: ${url}`;
  if (navigator.share){ navigator.share({text:msg}).catch(() => {}); }
  else window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

/* ============ الأحداث ============ */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.f){ filter = t.dataset.f; if (!DEMO) await load(); else render(); return; }
  if (t.dataset.p){ sel.item = t.dataset.p; drawSheet(); return; }
  if (t.dataset.s){ sel.status = t.dataset.s; drawSheet(); return; }
  if (t.id === 'submit') return submit();
  if (t.id === 'cancel') return closeSheet();
  if (t.dataset.a){
    const g = groups[+t.dataset.i]; if (!g) return;
    if (t.dataset.a === 'share') return shareReport(g.item, g.last.status, g.place);
    if (!posReal){ toast('فعّل الموقع لتأكيد البلاغ'); locate().then(render); return; }
    if (km(pos[0], pos[1], g.lat, g.lng) > 1){ toast('اقترب من المكان (ضمن 1 كم) لتأكيد البلاغ'); return; }
    const st = t.dataset.a === 'yes' ? 'available' : 'out';
    try { await send({item:g.item, status:st, lat:g.lat, lng:g.lng, place:g.place}); toast('شكراً على التأكيد 🙌'); load(); }
    catch (err){ toast(err.message === 'RATE' ? 'بلاغات كثيرة في وقت قصير' : 'تعذّر الإرسال'); }
  }
});
$('#fab').onclick = () => openSheet();
$('#bg').onclick = closeSheet;
$('#locBtn').onclick = async () => { await locate(); load(); };
$('#radius').onchange = e => { radius = +e.target.value; load(); };
$('#vList').onclick = () => { view = 'list'; $('#list').hidden = false; $('#map').hidden = true; $('#vList').classList.add('on'); $('#vMap').classList.remove('on'); };
$('#vMap').onclick = () => { view = 'map'; $('#list').hidden = true; $('#map').hidden = false; $('#vMap').classList.add('on'); $('#vList').classList.remove('on'); renderMap(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 45000);

/* ============ البدء ============ */
(async function init(){
  renderChips(); renderBanners();
  await locate();
  await load();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
